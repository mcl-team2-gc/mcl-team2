<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mine Monitor - Metrics</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0f172a">
</head>
<body>
<header id="app-header"></header>
<main>
  <div id="status"></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid two">
    <div class="card"><h2><span class="hic dark" data-ic="coal"></span>Coal - last 14 days (Tonnes)</h2><div class="chartbox"><canvas id="cCoal" role="img" aria-label="Daily coal production bar chart"></canvas></div></div>
    <div class="card"><h2><span class="hic " data-ic="layers"></span>OB - last 14 days (cu.m)</h2><div class="chartbox"><canvas id="cOb" role="img" aria-label="Daily OB removal bar chart"></canvas></div></div>
    <div class="card"><h2><span class="hic info" data-ic="pie"></span>Which shift produces more? (last 7 days, % share)</h2><div class="chartbox"><canvas id="cShift" role="img" aria-label="Shift share chart"></canvas></div></div>
    <div class="card"><h2><span class="hic ok" data-ic="truck"></span>Fleet deployed today, by machine type</h2><div class="chartbox"><canvas id="cFleet" role="img" aria-label="Fleet deployment chart"></canvas></div></div>
    <div class="card"><h2><span class="hic bad" data-ic="alert"></span>Hours lost by kind of hindrance</h2><div class="chartbox"><canvas id="cHind" role="img" aria-label="Hours lost chart"></canvas></div></div>
  </div>
  <p class="muted" id="stamp">Production is counted up to the end of the previous shift. Refreshes every 5 minutes.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
var T = MCL.TABLE, esc = MCL.esc, num = MCL.num;
var $ = function (id) { return document.getElementById(id); };
var db = null, charts = {};
var COL = { Coal: "#374151", OB: "#b45309", target: "#047857", A: "#1d4ed8", B: "#b45309", C: "#6b7280" };

if (window.Chart && Chart.defaults && Chart.defaults.font) {
  Chart.defaults.font.family = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  Chart.defaults.color = "#64748b";
  Chart.defaults.borderColor = "#eef0f3";
  Chart.defaults.plugins.legend.labels.usePointStyle = true;
  Chart.defaults.elements.bar.borderRadius = 6;
}
function mk(id, cfg) {
  if (charts[id]) charts[id].destroy();
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false }, cfg.options || {});
  charts[id] = new Chart($(id), cfg);
}
function sumBy(rows, f) { return rows.reduce(function (a, r) { return a + (Number(r[f]) || 0); }, 0); }
var kpi = MCL.kpi;
Array.prototype.forEach.call(document.querySelectorAll("[data-ic]"), function (el) { el.innerHTML = MCL.icon(el.dataset.ic); });
function latest(targets, p, m) { return targets.filter(function (r) { return r.category === p && r.title === m; })[0]; }

async function load() {
  if (!MCL.configReady()) {
    MCL.renderHeader("metrics", null);
    MCL.showMsg($("status"), "info", "The database settings in config.js are not filled in yet. Ask the Data Keeper to paste the Project URL and publishable key.");
    return;
  }
  if (typeof Chart === "undefined") { MCL.showMsg($("status"), "err", "The chart library did not load. Check the internet connection and refresh."); }
  db = db || window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
  try {
    var setting = await MCL.loadSetting(db), now = MCL.renderHeader("metrics", setting);
    var month = now.shiftDate.slice(0, 8) + "01", from14 = MCL.addDays(now.shiftDate, -13);
    var since = month < from14 ? month : from14;
    var res = await Promise.all([
      MCL.fetchAll(function () { return db.from(T).select("id,title,qty,shift,record_date").eq("record_type", "production").gte("record_date", since).order("id"); }),
      MCL.fetchAll(function () { return db.from(T).select("id,record_type,category,title,qty,status,urgency,shift,record_date").in("record_type", ["target", "hindrance"]).order("created_at", { ascending: false }).order("id"); }),
      MCL.fetchAll(function () { return db.from(T).select("id,record_type,category,qty,shift,status,record_date").eq("record_type", "deploy").eq("record_date", now.shiftDate).order("id"); }),
      MCL.fetchAll(function () { return db.from(T).select("id,record_type,category,qty,status").in("record_type", ["face", "instruction", "breakdown"]).neq("status", "Resolved").order("id"); })
    ]);
    function pick(rows, type) { return rows.filter(function (r) { return r.record_type === type; }); }
    var prod = res[0].filter(function (r) { return !(r.record_date === now.shiftDate && r.shift === now.shift); });
    var targets = pick(res[1], "target"), hind = pick(res[1], "hindrance");
    var deploys = res[2], faces = pick(res[3], "face").filter(function (r) { return r.status === "In progress"; });
    var ins = pick(res[3], "instruction"), bd = pick(res[3], "breakdown");

    // KPI tiles
    var k = "";
    ["Coal", "OB"].forEach(function (m) {
      var act = sumBy(prod.filter(function (r) { return r.title === m && r.record_date >= month; }), "qty");
      var t = latest(targets, "Monthly", m);
      k += kpi(m + " this month", t ? num(act / Number(t.qty) * 100, 1) + "%" : MCL.fmtQty(act, m), t ? MCL.fmtQty(act, m) + " of " + MCL.fmtQty(Number(t.qty), m) : "no monthly target set", "info", m === "Coal" ? "coal" : "layers");
    });
    var openH = hind.filter(function (r) { return r.status !== "Resolved"; });
    k += kpi("Open hindrances", num(openH.length), num(sumBy(openH, "qty"), 1) + " hours lost so far", openH.length ? "warn" : "ok", "alert");
    k += kpi("Machines in breakdown", num(bd.length), num(sumBy(bd, "qty"), 1) + " hours lost so far", bd.length ? "bad" : "ok", "wrench");
    k += kpi("Active faces", num(faces.length), "", "info", "pickaxe");
    k += kpi("Machines deployed today", num(sumBy(deploys, "qty")), "", "info", "truck");
    k += kpi("Open instructions", num(ins.length), "", ins.length ? "warn" : "ok", "megaphone");
    $("kpis").innerHTML = k;
    if (typeof Chart === "undefined") return;

    // Daily production for the last 14 days, with the daily target as a line
    var days = []; for (var i = 13; i >= 0; i--) days.push(MCL.addDays(now.shiftDate, -i));
    [["Coal", "cCoal"], ["OB", "cOb"]].forEach(function (p) {
      var m = p[0], t = latest(targets, "Daily", m), tv = t ? Number(t.qty) : null;
      var ds = [{ type: "bar", label: "Actual", backgroundColor: COL[m],
        data: days.map(function (d) { return sumBy(prod.filter(function (r) { return r.title === m && r.record_date === d; }), "qty"); }) }];
      if (tv) ds.push({ type: "line", label: "Daily target", borderColor: COL.target, backgroundColor: COL.target, pointRadius: 0, borderDash: [6, 4], data: days.map(function () { return tv; }) });
      mk(p[1], { data: { labels: days.map(function (d) { return d.slice(8) + "/" + d.slice(5, 7); }), datasets: ds }, options: { scales: { y: { beginAtZero: true, title: { display: true, text: MCL.UNITS[m].base } } } } });
    });

    // Share of production by shift, last 7 days
    var d7 = MCL.addDays(now.shiftDate, -6);
    var share = ["Coal", "OB"].map(function (m) {
      var rows = prod.filter(function (r) { return r.title === m && r.record_date >= d7; }), tot = sumBy(rows, "qty");
      return { label: m, backgroundColor: COL[m], data: ["A", "B", "C"].map(function (s) { return tot ? Math.round(sumBy(rows.filter(function (r) { return r.shift === s; }), "qty") / tot * 1000) / 10 : 0; }) };
    });
    mk("cShift", { type: "bar", data: { labels: ["Shift A", "Shift B", "Shift C"], datasets: share }, options: { scales: { y: { beginAtZero: true, max: 100, title: { display: true, text: "% of production" } } } } });

    // Fleet deployed today by machine type, stacked by shift
    var types = Object.keys(deploys.reduce(function (a, r) { a[r.category || "Other"] = 1; return a; }, {}));
    mk("cFleet", { type: "bar", data: { labels: types, datasets: ["A", "B", "C"].map(function (s) {
      return { label: "Shift " + s, backgroundColor: COL[s], data: types.map(function (t) { return sumBy(deploys.filter(function (r) { return r.shift === s && (r.category || "Other") === t; }), "qty"); }) }; }) },
      options: { scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } } });

    // Hours lost by kind
    var kinds = {}; hind.forEach(function (r) { var c = r.category || "Other"; kinds[c] = (kinds[c] || 0) + (Number(r.qty) || 0); });
    var kn = Object.keys(kinds).sort(function (a, b) { return kinds[b] - kinds[a]; });
    mk("cHind", { type: "bar", data: { labels: kn, datasets: [{ label: "Hours lost", backgroundColor: "#b91c1c", data: kn.map(function (c) { return kinds[c]; }) }] },
      options: { indexAxis: "y", plugins: { legend: { display: false } } } });
    $("stamp").textContent = "Updated " + MCL.clockText() + ". Production counts up to the end of the previous shift. Refreshes every 5 minutes.";
    if (!($("status").innerHTML.indexOf("did not load") > -1)) $("status").innerHTML = "";
  } catch (e) {
    MCL.showMsg($("status"), "err", "Could not load the metrics. Has 01-setup.sql been run?", e);
  }
}
MCL.autoRefresh(load, 300000);
</script>
</body>
</html>
