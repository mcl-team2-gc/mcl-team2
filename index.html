<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mine Monitor - Data entry</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="app-header"></header>
<main>
  <div id="status"></div>

  <section id="login" class="card login" hidden>
    <h2>Sign in to enter data</h2>
    <p class="muted">Pick your role and type your passcode. The Dashboard needs no passcode.</p>
    <label for="role">Role</label>
    <select id="role">
      <option value="gm">General Manager</option>
      <option value="po">Project Officer</option>
      <option value="mm">Mine Manager</option>
      <option value="pi">Production Incharge</option>
      <option value="shift">Shift Incharge</option>
      <option value="overman">Overman</option>
      <option value="admin">Admin</option>
    </select>
    <div id="nameRow" hidden>
      <label for="uname">Your name or ID (Overman)</label>
      <input id="uname" type="text" autocomplete="off" placeholder="Same name the Shift Incharge uses">
    </div>
    <label for="code">Passcode</label>
    <input id="code" type="password" autocomplete="off">
    <button id="loginBtn">Sign in</button>
  </section>

  <section id="app" hidden>
    <div class="card userbar">
      <div style="display:flex;gap:10px;align-items:center;min-width:0"><span class="avatar" id="av"></span>
        <div style="min-width:0"><div class="muted small">Signed in as</div><b id="who"></b></div></div>
      <button class="small alt" id="logout">Sign out</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="module"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
var T = MCL.TABLE, esc = MCL.esc;
var ROLE_NAMES = { gm: "General Manager", po: "Project Officer", mm: "Mine Manager",
                   pi: "Production Incharge", shift: "Shift Incharge", overman: "Overman", admin: "Admin" };
var SHIFTS = [["A","A (6 am - 2 pm)"],["B","B (2 pm - 10 pm)"],["C","C (10 pm - 6 am)"]];
var URG = [["Low","Low"],["Medium","Medium"],["High","High"]];
var MAT = [["Coal","Coal"],["OB","OB (overburden)"]];
var MTYPES = ["Shovel","Excavator","Dumper","Dozer","Drill","Pay loader","Surface miner","Water tanker","Other"].map(function (x) { return [x, x]; });
var FOR_WHO = [["All","Everyone"]].concat(Object.keys(ROLE_NAMES).filter(function (k) { return k !== "admin"; }).map(function (k) { return [ROLE_NAMES[k], ROLE_NAMES[k]]; }));
var STAT_LABELS = {
  face:        { "Open": "Planned", "In progress": "Active", "Resolved": "Closed" },
  hindrance:   { "Open": "Open", "In progress": "Being solved", "Resolved": "Resolved" },
  fleet:       { "Open": "Idle", "In progress": "Running", "Resolved": "Off duty" },
  breakdown:   { "Open": "Breakdown", "In progress": "Under repair", "Resolved": "Back in service" },
  instruction: { "Open": "New", "In progress": "Being acted on", "Resolved": "Done" }
};
function opts(map) { return Object.keys(map).map(function (k) { return [k, map[k]]; }); }

// One module = one kind of record. "roles" says who may use it. Admin and General Manager see all modules.
var MODULES = [
  { id: "setting", label: "Mine name, date, time", roles: ["admin"], hint:
    "Choose the system clock (automatic, in the time zone you pick) or set date and time by hand. The Date and Time boxes below are used only for 'by hand'.",
    fields: [ { k: "title", l: "Mine name", t: "text", req: 1 },
              { k: "details", l: "Date and time source", t: "select", o: [["system","Use system clock (automatic)"],["manual","Set date and time by hand"]], d: "system" },
              { k: "category", l: "Time zone", t: "select", o: MCL.TZS.map(function (z) { return [z, z]; }), d: MCL.DEFAULT_TZ },
              { k: "record_date", l: "Date (by hand only)", t: "date" },
              { k: "record_time", l: "Time (by hand only)", t: "time" } ],
    line: function (r) { return r.title + " | " + (r.category || MCL.DEFAULT_TZ) + " | " + (r.details === "manual" ? "by hand " + (r.record_date || "") + " " + (r.record_time || "") : "system clock"); } },

  { id: "target", label: "Targets", roles: ["po", "mm"], hint:
    "Newest entry for each Period + Material is used. Coal is in Tonnes (or Million Tonnes), OB in cu.m (or Million cu.m). Pick the unit first.",
    fields: [ { k: "category", l: "Period", t: "select", o: [["Annual","Annual"],["Monthly","Monthly"],["Daily","Daily"]] },
              { k: "title", l: "Material", t: "select", o: MAT },
              { k: "_unit", l: "Unit of the quantity", t: "select", virtual: 1, o: [["1","Tonnes (Coal) / cu.m (OB)"],["1000000","Million Tonnes (Coal) / Million cu.m (OB)"]], d: "1" },
              { k: "qty", l: "Target quantity", t: "number", req: 1, scaled: 1 } ],
    line: function (r) { return r.category + " " + r.title + " target: " + MCL.fmtQty(r.qty, r.title); } },

  { id: "instruction", label: "Instructions", roles: ["po", "mm"], hint:
    "Instructions to your team. They show at the top of the dashboard until marked Done.",
    fields: [ { k: "title", l: "Instruction", t: "text", req: 1 },
              { k: "location", l: "For", t: "select", o: FOR_WHO },
              { k: "urgency", l: "Urgency", t: "select", o: URG, d: "Medium" },
              { k: "details", l: "More details", t: "textarea" } ],
    flow: true, line: function (r) { return r.title + (r.location ? " (for " + r.location + ")" : "") + (r.entered_by ? " - by " + (ROLE_NAMES[(r.entered_by || "").split(":")[0]] || r.entered_by) : ""); } },

  { id: "face", label: "Working faces", roles: ["pi"], hint:
    "Create a face, then set it Active to start production there. Set it Closed to stop. Shift Incharge can deploy machines only on Active faces.",
    fields: [ { k: "category", l: "Type", t: "select", o: MAT },
              { k: "title", l: "Face name / number", t: "text", req: 1 },
              { k: "location", l: "Location (panel / bench)", t: "text" },
              { k: "status", l: "Status", t: "select", o: opts(STAT_LABELS.face), d: "In progress" },
              { k: "urgency", l: "Urgency", t: "select", o: URG },
              { k: "details", l: "Remarks", t: "textarea" } ],
    flow: true, line: function (r) { return r.category + " face " + r.title + (r.location ? " @ " + r.location : ""); } },

  { id: "assign", label: "Overman assignment", roles: ["shift"], hint:
    "Assign an Overman to an Active face for a shift. Type the name or ID exactly as the Overman types it when signing in.",
    fields: [ { k: "record_date", l: "Date (night shift after midnight = previous date)", t: "date", today: 1, req: 1 },
              { k: "shift", l: "Shift", t: "select", o: SHIFTS },
              { k: "title", l: "Active face", t: "select", dyn: "faces", req: 1 },
              { k: "location", l: "Overman name or ID", t: "text", req: 1 },
              { k: "details", l: "Remarks", t: "textarea" } ],
    line: function (r) { return r.record_date + " Shift " + r.shift + ": " + r.location + " @ " + r.title; } },

  { id: "fleet", label: "Running fleet status", roles: ["overman", "shift"], auto: 1, hint:
    "Report a machine working on your face. Use the buttons in the list below to change it to Running, Idle or Off duty. Machine broke down? Use the Breakdowns tab.",
    fields: [ { k: "location", l: "Face", t: "select", dyn: "auto", req: 1 },
              { k: "title", l: "Machine ID", t: "text", req: 1 },
              { k: "category", l: "Machine type", t: "select", o: MTYPES },
              { k: "status", l: "Status now", t: "select", o: opts(STAT_LABELS.fleet), d: "In progress" },
              { k: "details", l: "Remarks", t: "textarea" } ],
    flow: true, line: function (r) { return r.title + " (" + r.category + ") @ " + r.location; } },

  { id: "breakdown", label: "Breakdowns", roles: ["overman", "shift"], auto: 1, hint:
    "Report a machine breakdown. When repair starts or ends, change the status with the buttons below. The machine shows as Breakdown on the dashboard until it is Back in service.",
    fields: [ { k: "location", l: "Face", t: "select", dyn: "auto", req: 1 },
              { k: "title", l: "Machine ID (same as in Running fleet status)", t: "text", req: 1 },
              { k: "category", l: "Machine type", t: "select", o: MTYPES },
              { k: "urgency", l: "Urgency", t: "select", o: URG, d: "High" },
              { k: "qty", l: "Hours lost so far (optional)", t: "number" },
              { k: "details", l: "What went wrong", t: "textarea" } ],
    flow: true, line: function (r) { return r.title + " (" + r.category + ") @ " + r.location; } },

  { id: "deploy", label: "Fleet deployment", roles: ["shift"], hint:
    "Pick an Active face and say how many machines of one type are working there this shift. Add one entry for each machine type.",
    fields: [ { k: "record_date", l: "Date (night shift after midnight = previous date)", t: "date", today: 1, req: 1 },
              { k: "shift", l: "Shift", t: "select", o: SHIFTS },
              { k: "title", l: "Active face", t: "select", dyn: "faces", req: 1 },
              { k: "category", l: "Machine type", t: "select", o: MTYPES },
              { k: "qty", l: "How many machines", t: "number", req: 1 },
              { k: "details", l: "Remarks", t: "textarea" } ],
    line: function (r) { return r.record_date + " Shift " + r.shift + ": " + r.qty + " x " + r.category + " @ " + r.title; } },

  { id: "machine", label: "Fleet available", roles: ["shift"], hint:
    "How many machines of each type are available (ready to work) in a shift. The newest entry for each shift and type is used.",
    fields: [ { k: "record_date", l: "Date", t: "date", today: 1, req: 1 },
              { k: "shift", l: "Shift", t: "select", o: SHIFTS },
              { k: "category", l: "Machine type", t: "select", o: MTYPES },
              { k: "qty", l: "Number available", t: "number", req: 1 },
              { k: "details", l: "Remarks", t: "textarea" } ],
    line: function (r) { return r.record_date + " Shift " + r.shift + ": " + (r.qty == null ? 1 : r.qty) + " x " + (r.category || r.title) + " available"; } },

  { id: "trip", label: "Trips (current shift)", roles: ["shift", "overman"], hint:
    "Enter NEW trips counted since your last entry. The dashboard adds them up to estimate this shift.",
    fields: [ { k: "record_date", l: "Date (night shift after midnight = previous date)", t: "date", today: 1, req: 1 },
              { k: "shift", l: "Shift", t: "select", o: SHIFTS },
              { k: "title", l: "Material", t: "select", o: MAT },
              { k: "qty", l: "Number of trips", t: "number", req: 1 },
              { k: "qty2", l: "Quantity per trip (tonnes or cu.m)", t: "number", req: 1 },
              { k: "location", l: "From face", t: "text" } ],
    line: function (r) { return r.record_date + " " + r.shift + ": " + r.title + " " + r.qty + " trips x " + r.qty2; } },

  { id: "production", label: "Production status", roles: ["shift"], hint:
    "Enter the final figure of a COMPLETED shift only. One entry per shift per material. Coal in Tonnes (or Million Tonnes), OB in cu.m (or Million cu.m). Pick the unit first.",
    fields: [ { k: "record_date", l: "Date (night shift after midnight = previous date)", t: "date", today: 1, req: 1 },
              { k: "shift", l: "Shift", t: "select", o: SHIFTS },
              { k: "title", l: "Material", t: "select", o: MAT },
              { k: "_unit", l: "Unit of the quantity", t: "select", virtual: 1, o: [["1","Tonnes (Coal) / cu.m (OB)"],["1000000","Million Tonnes (Coal) / Million cu.m (OB)"]], d: "1" },
              { k: "qty", l: "Actual production", t: "number", req: 1, scaled: 1 } ],
    line: function (r) { return r.record_date + " Shift " + r.shift + ": " + r.title + " " + MCL.fmtQty(r.qty, r.title); } },

  { id: "hindrance", label: "Hindrances", roles: ["pi", "shift", "overman", "po", "mm"], hint:
    "Overman: pick one of your assigned faces. Anything stopping or slowing production. Update the status when it is being solved or is solved.",
    fields: [ { k: "category", l: "Kind", t: "select", o: ["Machine breakdown","Blasting / drilling","Rain / weather","Land / R&R","Law and order","Power / diesel","Road / haul road","Manpower","Other"].map(function (x) { return [x, x]; }) },
              { k: "title", l: "Short title", t: "text", req: 1 },
              { k: "location", l: "Location", t: "text", ovFace: 1 },
              { k: "urgency", l: "Urgency", t: "select", o: URG, d: "Medium" },
              { k: "status", l: "Status", t: "select", o: opts(STAT_LABELS.hindrance) },
              { k: "qty", l: "Hours lost so far (optional)", t: "number" },
              { k: "details", l: "Details", t: "textarea" } ],
    flow: true, line: function (r) { return r.category + ": " + r.title + (r.location ? " @ " + r.location : ""); } }
];
var ALL_ROLES = ["admin", "gm"];   // these two see every module

var db = null, role = null, cur = null, uname = "", SETTING = null;
var $ = function (id) { return document.getElementById(id); };
function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

async function start() {
  MCL.renderHeader("entry", null);
  if (!MCL.configReady()) {
    MCL.showMsg($("status"), "info", "The database settings in config.js are not filled in yet. Ask the Data Keeper to paste the Project URL and publishable key.");
    return;
  }
  db = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
  try { SETTING = await MCL.loadSetting(db); MCL.renderHeader("entry", SETTING); }
  catch (e) { MCL.showMsg($("status"), "err", "Could not reach the database. Has 01-setup.sql been run?", e); }
  var saved = null;
  try { saved = sessionStorage.getItem("mclRole"); } catch (e) {}
  try { uname = saved === "overman" ? (sessionStorage.getItem("mclName") || "") : ""; } catch (e) {}
  if (saved === "overman" && !uname) saved = null;
  if (saved && ROLE_NAMES[saved]) { role = saved; showApp(); } else { $("login").hidden = false; }
}

$("role").onchange = function () { $("nameRow").hidden = $("role").value !== "overman"; };
$("loginBtn").onclick = async function () {
  var r = $("role").value, code = $("code").value;
  if (!code) { MCL.showMsg($("status"), "err", "Please type your passcode."); return; }
  var nm = $("uname").value.trim();
  if (r === "overman" && !nm) { MCL.showMsg($("status"), "err", "Overman: please type your name or ID."); return; }
  if (!db) { MCL.showMsg($("status"), "err", "Database is not connected yet."); return; }
  try {
    var res = await db.from(T).select("details,created_at").eq("record_type", "user").eq("category", r)
      .order("created_at", { ascending: true }).limit(1);       // the FIRST passcode row counts
    if (res.error) throw res.error;
    if (!res.data.length) { MCL.showMsg($("status"), "err", "No passcode is set for this role. Ask the Data Keeper to run 01-setup.sql."); return; }
    var h = await MCL.sha256("mcl:" + r + ":" + code);
    if (h !== res.data[0].details) { MCL.showMsg($("status"), "err", "Wrong passcode. Please try again."); return; }
    role = r; uname = r === "overman" ? nm : "";
    try { sessionStorage.setItem("mclRole", r); sessionStorage.setItem("mclName", uname); } catch (e) {}
    $("code").value = ""; $("status").innerHTML = ""; $("login").hidden = true; showApp();
  } catch (e) { MCL.showMsg($("status"), "err", "Sign-in failed.", e); }
};
$("logout").onclick = function () {
  try { sessionStorage.removeItem("mclRole"); sessionStorage.removeItem("mclName"); } catch (e) {}
  role = null; uname = ""; $("app").hidden = true; $("login").hidden = false;
};

function showApp() {
  $("app").hidden = false; $("login").hidden = true;
  $("who").textContent = ROLE_NAMES[role] + (uname ? " - " + uname : "");
  $("av").textContent = ROLE_NAMES[role].split(" ").map(function (w) { return w[0]; }).join("").slice(0, 2);
  var mine = MODULES.filter(function (m) { return ALL_ROLES.indexOf(role) > -1 ? true : m.roles.indexOf(role) > -1; });
  $("tabs").innerHTML = "";
  mine.forEach(function (m) {
    var b = document.createElement("button"); b.textContent = m.label; b.id = "tab-" + m.id;
    b.onclick = function () { openModule(m); }; $("tabs").appendChild(b);
  });
  openModule(mine[0]);
}

async function faceOptions(kind) {
  // kind "faces" = all Active faces; "myfaces" = faces assigned to this Overman for the running shift
  if (kind === "faces") {
    var fr = await db.from(T).select("title,category,location").eq("record_type", "face").eq("status", "In progress").order("created_at", { ascending: false });
    if (fr.error) throw fr.error;
    return fr.data.map(function (x) { return [x.title, x.title + " (" + x.category + (x.location ? ", " + x.location : "") + ")"]; });
  }
  var n = MCL.mineNow(SETTING);
  var ar = await db.from(T).select("title,location").eq("record_type", "assign").eq("record_date", n.shiftDate).eq("shift", n.shift).order("created_at", { ascending: false });
  if (ar.error) throw ar.error;
  var seen = {}, out = [];
  ar.data.forEach(function (x) {
    if ((x.location || "").trim().toLowerCase() === uname.trim().toLowerCase() && !seen[x.title]) { seen[x.title] = 1; out.push([x.title, x.title]); }
  });
  return out;
}

async function openModule(m) {
  cur = m;
  var F = m._f = m.fields.map(function (f) { return Object.assign({}, f); });
  for (var i = 0; i < F.length; i++) {
    var f = F[i];
    if (f.ovFace && role === "overman") { f.t = "select"; f.dyn = "myfaces"; f.l = "Your assigned face"; f.req = 1; }
    if (f.dyn === "auto") f.dyn = role === "overman" ? "myfaces" : "faces";
    if (f.dyn) {
      try { f.o = await faceOptions(f.dyn); }
      catch (e) { f.o = []; MCL.showMsg($("status"), "err", "Could not load the faces.", e); }
      f.empty = f.dyn === "myfaces" ? "No face is assigned to you for this shift yet. Ask the Shift Incharge to assign you." : "No Active face yet. Ask the Production Incharge to set a face to Active.";
    }
  }
  Array.prototype.forEach.call($("tabs").children, function (b) { b.className = b.id === "tab-" + m.id ? "on" : ""; });
  var h = '<div class="card"><h2>' + esc(m.label) + '</h2><p class="muted">' + esc(m.hint) + '</p><form id="f" class="formgrid">';
  F.forEach(function (f) {
    h += '<div' + (f.t === "textarea" || f.empty ? ' class="full"' : "") + '><label for="f_' + f.k + '">' + esc(f.l) + (f.req ? " *" : "") + "</label>";
    if (f.t === "select" && !f.o.length) {
      h += '<div class="msg info">' + esc(f.empty) + '</div><select id="f_' + f.k + '"></select>';
    } else if (f.t === "select") {
      h += '<select id="f_' + f.k + '">' + f.o.map(function (o) {
        return '<option value="' + esc(o[0]) + '"' + (o[0] === f.d ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select>";
    } else if (f.t === "textarea") { h += '<textarea id="f_' + f.k + '"></textarea>'; }
    else { h += '<input id="f_' + f.k + '" type="' + f.t + '"' + (f.t === "number" ? ' step="any" inputmode="decimal"' : "") +
           (f.today ? ' value="' + today() + '"' : "") + ">"; }
    h += "</div>";
  });
  h += '<div class="full"><button type="submit" id="saveBtn">Save</button></div></form><div id="fmsg"></div></div><div class="card"><h2>Latest entries</h2><div id="list">Loading...</div></div>';
  $("module").innerHTML = h;
  $("f").onsubmit = function (ev) { ev.preventDefault(); save(m); };
  loadList(m);
}

async function save(m) {
  var row = { record_type: m.id, entered_by: role === "overman" ? "overman:" + uname : role };
  if (m.auto) { var n = MCL.mineNow(SETTING); row.record_date = n.shiftDate; row.shift = n.shift; }   // date and shift filled automatically
  var F = m._f || m.fields, mult = 1;
  for (var i = 0; i < F.length; i++) {
    var f = F[i], v = $("f_" + f.k).value.trim();
    if (f.req && !v) { MCL.showMsg($("fmsg"), "err", "Please fill: " + f.l); return; }
    if (f.virtual) { mult = Number(v) || 1; continue; }
    if (v === "") continue;
    row[f.k] = f.t === "number" ? Number(v) : v;
  }
  F.forEach(function (f) { if (f.scaled && row[f.k] != null) row[f.k] = Math.round(row[f.k] * mult * 1000) / 1000; });
  try {
    $("saveBtn").disabled = true; $("saveBtn").textContent = "Saving...";
    var r = await db.from(T).insert(row);
    if (r.error) throw r.error;
    MCL.showMsg($("fmsg"), "ok", "Saved.");
    $("f").reset();
    F.forEach(function (f) { if (f.today) $("f_" + f.k).value = today(); });
    loadList(m);
    if (m.id === "setting") { SETTING = await MCL.loadSetting(db); MCL.renderHeader("entry", SETTING); }
  } catch (e) { MCL.showMsg($("fmsg"), "err", "Could not save.", e); }
  finally { var sb = $("saveBtn"); if (sb) { sb.disabled = false; sb.textContent = "Save"; } }   // stops double saving
}

async function loadList(m) {
  try {
    var r = await db.from(T).select("*").eq("record_type", m.id).order("created_at", { ascending: false }).limit(12);
    if (r.error) throw r.error;
    if (!r.data.length) { $("list").textContent = "Nothing entered yet."; return; }
    $("list").innerHTML = r.data.map(function (x) {
      var s = '<div class="item">' + esc(m.line(x));
      if (m.flow) {
        s += ' <span class="badge ' + esc(x.urgency) + '">' + esc(x.urgency) + '</span> <span class="badge st">' +
             esc((STAT_LABELS[m.id] || {})[x.status] || x.status) + "</span><br>";
        Object.keys(STAT_LABELS[m.id]).forEach(function (st) {
          if (st !== x.status) s += '<button class="small alt" data-id="' + x.id + '" data-st="' + st + '">Mark: ' + esc(STAT_LABELS[m.id][st]) + "</button>";
        });
      }
      return s + "</div>";
    }).join("");
    Array.prototype.forEach.call($("list").querySelectorAll("button[data-id]"), function (b) {
      b.onclick = async function () {
        try {
          var u = await db.from(T).update({ status: b.dataset.st }).eq("id", b.dataset.id);
          if (u.error) throw u.error;
          loadList(m);
        } catch (e) { MCL.showMsg($("fmsg"), "err", "Could not update the status.", e); }
      };
    });
  } catch (e) { MCL.showMsg($("list"), "err", "Could not load entries.", e); }
}
start();
</script>
</body>
</html>
